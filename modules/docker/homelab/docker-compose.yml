x-family-service: &family-service
  restart: unless-stopped
  labels:
    com.centurylinklabs.watchtower.enable: "false"

x-nextcloud-image: &nextcloud-image nextcloud:33.0.9-apache@sha256:6df481c0861b87366086df72a63a8f041e3680c715edb12f8444902223b51c09
x-postgres-image: &postgres-image postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
x-redis-image: &redis-image redis:8.2.10-alpine3.22@sha256:b51665e66f00759be7c3152ad5ac3c66fb2f619c13ef62dea7cc1f9914524635

x-nextcloud-environment: &nextcloud-environment
  POSTGRES_HOST: nextcloud-db
  POSTGRES_DB: nextcloud
  POSTGRES_USER: nextcloud
  POSTGRES_PASSWORD_FILE: /run/secrets/nextcloud_db
  REDIS_HOST: nextcloud-redis
  NEXTCLOUD_TRUSTED_DOMAINS: cloud.homelab
  TRUSTED_PROXIES: 172.30.50.2
  APACHE_DISABLE_REWRITE_IP: "1"
  OVERWRITEHOST: cloud.homelab
  OVERWRITEPROTOCOL: https
  OVERWRITECLIURL: https://cloud.homelab
  PHP_MEMORY_LIMIT: 512M
  PHP_UPLOAD_LIMIT: 512M

x-nextcloud-volumes: &nextcloud-volumes
  - type: bind
    source: /storage/apps/nextcloud/html
    target: /var/www/html
    bind:
      create_host_path: false

services:

  # ── AdGuard Home (DNS + Ad Blocker) ───────────────────
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    restart: unless-stopped
    ports:
      - "192.168.178.75:53:53/tcp"
      - "192.168.178.75:53:53/udp"
      - "100.99.212.33:53:53/tcp"
      - "100.99.212.33:53:53/udp"
      # Port 3000 (web UI) not exposed on host — Caddy proxies to it
    volumes:
      - /mnt/storage/docker/nas/adguard/work:/opt/adguardhome/work
      - /mnt/storage/docker/nas/adguard/conf:/opt/adguardhome/conf
    networks:
      - homelab
    # First run: access http://NAS_IP:3000 to complete setup wizard.
    # Afterwards configure:
    #   Upstream DNS: 1.1.1.1, 9.9.9.9
    #   DNS rewrites: *.home.local → NAS_IP

  # ── Syncthing ─────────────────────────────────────────
  syncthing:
    image: syncthing/syncthing:latest
    container_name: syncthing
    restart: unless-stopped
    hostname: homelab
    ports:
      - "22000:22000/tcp"   # Sync protocol (TCP)
      - "22000:22000/udp"   # Sync protocol (QUIC)
      - "21027:21027/udp"   # Local discovery
      # Port 8384 (web UI) not exposed — Caddy proxies to it
    volumes:
      - /mnt/storage/syncthing:/var/syncthing
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    networks:
      - homelab

  # ── Homarr (Dashboard) ────────────────────────────────
  homarr:
    image: ghcr.io/ajnart/homarr:latest
    container_name: homarr
    restart: unless-stopped
    volumes:
      - /mnt/storage/docker/nas/homarr/configs:/app/data/configs
      - /mnt/storage/docker/nas/homarr/icons:/app/public/icons
      - /mnt/storage/docker/nas/homarr/data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - homelab

  # ── Watchtower (Auto-Updates) ─────────────────────────
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE=0 0 4 * * *   # daily at 04:00
      - TZ=${TZ}
    networks:
      - homelab

  # ── Vaultwarden (Password Manager) ────────────────────
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    volumes:
      - /mnt/storage/docker/nas/vaultwarden:/data
    environment:
      - DOMAIN=https://vault.homelab
      - SIGNUPS_ALLOWED=false   # set to true only during initial account creation
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
    networks:
      - homelab

  # ── Uptime Kuma (Monitoring) ──────────────────────────
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - /mnt/storage/docker/nas/uptime-kuma:/app/data
    networks:
      - homelab
    # Configure monitors in the web UI.
    # For VM services: add maintenance windows for when gaming rig is off.
    # Connect Ntfy as notification provider.

  # ── Portainer (Docker Management UI) ─────────────────
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/storage/docker/nas/portainer:/data
    networks:
      - homelab
    # Add service-vm and dev-vm as environments via UI → Environments → Add → Agent
    # Point to SERVICE_VM_IP:9001 and DEV_VM_IP:9001

  # ── Dozzle (Container Logs) ───────────────────────────
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    environment:
      - DOZZLE_REMOTE_HOST=agent://${SERVICE_VM_IP}:7007|service-vm,agent://${DEV_VM_IP}:7007|dev-vm
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - homelab

  # ── Caddy (Reverse Proxy) ─────────────────────────────
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "${TAILSCALE_IP}:80:80"
      - "${TAILSCALE_IP}:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /mnt/storage/docker/nas/caddy/data:/data
      - /mnt/storage/docker/nas/caddy/config:/config
    extra_hosts:
      - "host.docker.internal:172.18.0.1"  # reach native host services
    networks:
      homelab: {}
      family-proxy:
        ipv4_address: 172.30.50.2

  # ── Ntfy (Push Notifications) ─────────────────────────
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    restart: unless-stopped
    command: serve
    ports:
      - "127.0.0.1:8082:80"   # localhost only — NixOS services (smartd) send alerts here
    volumes:
      - /mnt/storage/docker/nas/ntfy:/var/lib/ntfy
    environment:
      - NTFY_BASE_URL=https://ntfy.home.local
      - NTFY_BEHIND_PROXY=true
    networks:
      - homelab
    # Subscribe on phone: https://ntfy.home.local/homelab-alerts
    # SMART alerts use topic: homelab-alerts
    # Uptime Kuma alerts: configure in Uptime Kuma UI → Notifications → Ntfy

  # ── Family applications (managed upgrades, no public ports) ──
  nextcloud-db:
    <<: *family-service
    image: *postgres-image
    container_name: nextcloud-db
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD_FILE: /run/secrets/nextcloud_db
    secrets: [nextcloud_db]
    volumes:
      - type: bind
        source: /storage/apps/nextcloud/postgres
        # PostgreSQL 18 stores its versioned PGDATA below this directory.
        target: /var/lib/postgresql
        bind: {create_host_path: false}
    networks: [nextcloud-backend]
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, nextcloud, -d, nextcloud]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  nextcloud-redis:
    <<: *family-service
    image: *redis-image
    container_name: nextcloud-redis
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - type: bind
        source: /storage/apps/nextcloud/redis
        target: /data
        bind: {create_host_path: false}
    networks: [nextcloud-backend]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 12

  nextcloud:
    <<: *family-service
    image: *nextcloud-image
    container_name: nextcloud
    environment:
      <<: *nextcloud-environment
      # Explicit bootstrap credentials enable the image's automatic installer.
      NEXTCLOUD_ADMIN_USER: nc-admin
      NEXTCLOUD_ADMIN_PASSWORD_FILE: /run/secrets/nextcloud_admin
    secrets: [nextcloud_db, nextcloud_admin]
    volumes: *nextcloud-volumes
    networks: [family-proxy, nextcloud-backend]
    depends_on:
      nextcloud-db: {condition: service_healthy}
      nextcloud-redis: {condition: service_healthy}
    stop_grace_period: 5m
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - >-
          $$context = stream_context_create(["http" => ["header" => "Host: cloud.homelab\r\n", "timeout" => 5]]);
          $$status = json_decode(@file_get_contents("http://127.0.0.1/status.php", false, $$context), true);
          exit(is_array($$status) && ($$status["installed"] ?? false) && !($$status["maintenance"] ?? true) && !($$status["needsDbUpgrade"] ?? true) ? 0 : 1);
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 5m

  nextcloud-cron:
    <<: *family-service
    image: *nextcloud-image
    container_name: nextcloud-cron
    entrypoint: /cron.sh
    environment: *nextcloud-environment
    secrets: [nextcloud_db]
    volumes: *nextcloud-volumes
    networks: [family-proxy, nextcloud-backend]
    depends_on:
      nextcloud: {condition: service_healthy}
    stop_grace_period: 5m

  paperless-db:
    <<: *family-service
    image: *postgres-image
    container_name: paperless-db
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD_FILE: /run/secrets/paperless_db
    secrets: [paperless_db]
    volumes:
      - type: bind
        source: /storage/apps/paperless/postgres
        target: /var/lib/postgresql
        bind: {create_host_path: false}
    networks: [paperless-backend]
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, paperless, -d, paperless]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  paperless-redis:
    <<: *family-service
    image: *redis-image
    container_name: paperless-redis
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - type: bind
        source: /storage/apps/paperless/redis
        target: /data
        bind: {create_host_path: false}
    networks: [paperless-backend]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 12

  paperless:
    <<: *family-service
    image: ghcr.io/paperless-ngx/paperless-ngx:3.3.0@sha256:6b94799bc769a063b3340cc5847402e626d4d91d29a295a8e747f8e9bead4207
    container_name: paperless
    environment:
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: paperless-db
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS_FILE: /run/secrets/paperless_db
      PAPERLESS_SECRET_KEY_FILE: /run/secrets/paperless_key
      PAPERLESS_REDIS: redis://paperless-redis:6379
      PAPERLESS_ADMIN_USER: paperless-admin
      PAPERLESS_ADMIN_PASSWORD_FILE: /run/secrets/paperless_admin
      PAPERLESS_URL: https://docs.homelab
      PAPERLESS_ALLOWED_HOSTS: docs.homelab
      PAPERLESS_PROXY_SSL_HEADER: '["HTTP_X_FORWARDED_PROTO", "https"]'
      PAPERLESS_TRUSTED_PROXIES: 172.30.50.2
      PAPERLESS_TIME_ZONE: Europe/Berlin
      PAPERLESS_OCR_LANGUAGE: deu+eng
      PAPERLESS_TASK_WORKERS: "1"
      PAPERLESS_THREADS_PER_WORKER: "2"
      USERMAP_UID: "1000"
      USERMAP_GID: "1000"
    secrets: [paperless_db, paperless_key, paperless_admin]
    volumes:
      - type: bind
        source: /storage/apps/paperless/data
        target: /usr/src/paperless/data
        bind: {create_host_path: false}
      - type: bind
        source: /storage/apps/paperless/media
        target: /usr/src/paperless/media
        bind: {create_host_path: false}
      - type: bind
        source: /storage/apps/paperless/consume
        target: /usr/src/paperless/consume
        bind: {create_host_path: false}
      - type: bind
        source: /storage/apps/paperless/export
        target: /usr/src/paperless/export
        bind: {create_host_path: false}
    networks: [family-proxy, paperless-backend]
    depends_on:
      paperless-db: {condition: service_healthy}
      paperless-redis: {condition: service_healthy}
    stop_grace_period: 5m
    healthcheck:
      test: [CMD, curl, -fsSL, --max-time, "5", http://localhost:8000]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 5m

# Files exist only on the Docker host, outside the repository and Nix store.
# prepare-family-apps creates them once, never rotates existing credentials.
secrets:
  nextcloud_db:
    file: /var/lib/homelab-app-credentials/nextcloud_db
  nextcloud_admin:
    file: /var/lib/homelab-app-credentials/nextcloud_admin
  paperless_db:
    file: /var/lib/homelab-app-credentials/paperless_db
  paperless_key:
    file: /var/lib/homelab-app-credentials/paperless_key
  paperless_admin:
    file: /var/lib/homelab-app-credentials/paperless_admin

networks:
  family-proxy:
    name: homelab-family-proxy
    ipam:
      config:
        - subnet: 172.30.50.0/28
          # Keep dynamic app addresses away from Caddy's fixed .2 address.
          ip_range: 172.30.50.8/29
  nextcloud-backend:
    internal: true
  paperless-backend:
    internal: true
  homelab:
    driver: bridge
    name: homelab
    driver_opts:
      com.docker.network.bridge.name: homelab-br
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1
